[package]
name = "upgrade-lab"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Approval-driven dependency upgrades with native OS sandboxing"
license = "Apache-2.0"
publish = false

[dependencies]
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"

[[bin]]
name = "upgrade-lab"
path = "src/main.rs"
