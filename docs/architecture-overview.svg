<svg xmlns="http://www.w3.org/2000/svg" width="800" height="850" viewBox="0 0 800 850" role="img" aria-labelledby="title desc">
  <title id="title">UpgradeFactory layered architecture overview</title>
  <desc id="desc">Six conceptual layers. The trusted application contains interfaces, policy and evidence, state and adapters, and job coordination. Restricted jobs run behind an operating-system sandbox and use Java, Maven and Trivy. Agents, GitLab integration, a web interface and the Linux sandbox are planned. Credentials and approval records remain outside jobs.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .heading { font-size: 24px; font-weight: 700; fill: #14263d; }
      .region { font-size: 13px; font-weight: 700; letter-spacing: 1px; fill: #385271; }
      .label { font-size: 18px; font-weight: 700; fill: #14263d; }
      .body { font-size: 15px; fill: #28415e; }
      .planned { font-size: 14px; fill: #53657b; }
      .note { font-size: 14px; fill: #385271; }
      .number { font-size: 17px; font-weight: 700; fill: #fff; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#758aa3"/></marker>
  </defs>
  <rect width="800" height="850" rx="16" fill="#f6f8fc"/>
  <text x="32" y="43" class="heading">UpgradeFactory</text>
  <text x="32" y="69" class="note">Layered overview · implemented foundation and planned extensions</text>

  <rect x="20" y="88" width="760" height="453" rx="12" fill="#eaf0f9" stroke="#bacbe2"/>
  <text x="38" y="114" class="region">TRUSTED APPLICATION</text>

  <rect x="38" y="130" width="724" height="84" rx="8" fill="#fff" stroke="#b8cce8"/>
  <circle cx="66" cy="161" r="16" fill="#3164a8"/><text x="66" y="167" text-anchor="middle" class="number">1</text>
  <text x="94" y="160" class="label">Interaction</text>
  <text x="94" y="184" class="body">CLI: repository status, findings and batch decisions</text>
  <text x="94" y="204" class="planned">Planned: authenticated API and web interface</text>

  <path d="M400 215V226" stroke="#758aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="38" y="233" width="724" height="84" rx="8" fill="#fff" stroke="#b8cce8"/>
  <circle cx="66" cy="264" r="16" fill="#3164a8"/><text x="66" y="270" text-anchor="middle" class="number">2</text>
  <text x="94" y="263" class="label">Evidence and policy</text>
  <text x="94" y="287" class="body">Scans · CVE triage · proposals · approval · scope and windows</text>
  <text x="94" y="307" class="planned">Planned: separate manual approval of the finished candidate</text>

  <path d="M400 318V329" stroke="#758aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="38" y="336" width="724" height="84" rx="8" fill="#fff" stroke="#b8cce8"/>
  <circle cx="66" cy="367" r="16" fill="#3164a8"/><text x="66" y="373" text-anchor="middle" class="number">3</text>
  <text x="94" y="366" class="label">State and integrations</text>
  <text x="94" y="390" class="body">SQLite: scan history, source/candidate SBOMs and audit</text>
  <text x="94" y="410" class="planned">Planned: GitLab adapter and model gateway; credentials stay here</text>

  <path d="M400 421V432" stroke="#758aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="38" y="439" width="724" height="84" rx="8" fill="#fff" stroke="#b8cce8"/>
  <circle cx="66" cy="470" r="16" fill="#3164a8"/><text x="66" y="476" text-anchor="middle" class="number">4</text>
  <text x="94" y="469" class="label">Job coordination and execution</text>
  <text x="94" y="493" class="body">Pinned tools · claims and locks · isolated candidates · verification</text>
  <text x="94" y="513" class="planned">Planned: scheduling, agent orchestration and bounded repair loops</text>

  <path d="M400 542V575" stroke="#758aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="31" y="548" width="292" height="23" rx="4" fill="#f6f8fc"/>
  <text x="38" y="564" class="region">OS-ENFORCED TRUST BOUNDARY</text>

  <rect x="20" y="582" width="760" height="222" rx="12" fill="#eaf4ef" stroke="#a7c7b3"/>
  <text x="38" y="608" class="region">RESTRICTED JOB ENVIRONMENT</text>
  <rect x="38" y="622" width="724" height="74" rx="8" fill="#fff" stroke="#a7c7b3"/>
  <circle cx="66" cy="651" r="16" fill="#377553"/><text x="66" y="657" text-anchor="middle" class="number">5</text>
  <text x="94" y="650" class="label">Native sandbox</text>
  <text x="94" y="673" class="body">macOS Seatbelt · explicit paths · controlled environment and network</text>
  <text x="94" y="691" class="planned">Planned Linux alternative: Bubblewrap + seccomp</text>

  <path d="M400 697V708" stroke="#758aa3" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="38" y="715" width="724" height="74" rx="8" fill="#fff" stroke="#a7c7b3"/>
  <circle cx="66" cy="744" r="16" fill="#377553"/><text x="66" y="750" text-anchor="middle" class="number">6</text>
  <text x="94" y="743" class="label">Job tools and workers</text>
  <text x="94" y="766" class="body">Java / Maven · tests · CycloneDX · Trivy</text>
  <text x="94" y="784" class="planned">Planned: autonomous agents, with developer feedback where needed</text>

  <text x="32" y="831" class="note">No GitLab/provider credentials in jobs. Results return to the trusted verifier.</text>
</svg>
